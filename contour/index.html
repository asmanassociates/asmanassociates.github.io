<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Asman · Контур</title>
<meta name="theme-color" content="#0A0D11">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D11;--panel:#0D1115;--ink:#E8E6E0;--ink-dim:#878D95;--ink-faint:#565B61;--line:rgba(232,230,224,.10);--line-strong:rgba(232,230,224,.18);--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:Inter,"Helvetica Neue",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,select,input{font-family:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,13,17,.92);backdrop-filter:blur(6px);z-index:5}
.mark{display:flex;align-items:center;gap:14px;color:var(--ink);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.aa{position:relative;display:block;width:1.42em;height:.86em;font-family:"Bodoni Moda",Georgia,serif;font-size:22px;line-height:1}
.aa span{position:absolute;top:0;left:0}
.aa .a2{left:.42em}
.bar nav{display:flex;gap:22px;flex-wrap:wrap}
.bar nav a{font-size:13px;color:var(--ink-dim);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
.bar nav a.on,.bar nav a:hover{color:var(--ink);border-color:var(--line-strong)}
.meta{display:flex;gap:18px;font-size:12px;color:var(--ink-dim)}
.sla{color:#c9b7a4}
.page{padding:36px 28px 64px;max-width:1100px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 28px}
h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:36px 0 16px}
.note{font-size:13px;line-height:1.6;color:var(--ink-dim)}
.empty{color:var(--ink-dim);font-size:15px;padding:24px 0}
.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);padding:10px 14px;font-size:13px;min-height:44px;cursor:pointer}
.rules{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);list-style:none;margin:0 0 36px}
.rules li{background:var(--panel);padding:20px 16px}
.rules span{display:block;font-family:var(--serif);font-size:12px;color:var(--ink-faint);margin-bottom:10px}
.rules strong{display:block;font-weight:500;font-size:14px;margin-bottom:8px}
.rules p{font-size:13px;line-height:1.55;color:var(--ink-dim)}
.queue,.log{list-style:none}
.queue li{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.queue strong{display:block}
.queue span{font-size:13px;color:var(--ink-dim)}
.log li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-dim)}
.log time{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:4px}
.desk{display:grid;grid-template-columns:260px 1fr;min-height:calc(100dvh - 64px)}
.desk aside{border-right:1px solid var(--line);padding:32px 28px}
.desk ol{list-style:none;margin:0 0 28px}
.desk li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-dim)}
.desk li.on{color:var(--ink)}
.desk li.now{border-color:var(--line-strong);color:var(--ink)}
.desk-log{padding:32px 28px 12px;min-height:280px}
.desk-log p{max-width:560px;margin:0 0 22px;font-size:15px;line-height:1.65}
.desk-log p.lead{margin-left:auto;text-align:right;color:var(--ink-dim)}
.desk-log i{display:block;font-style:normal;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.composer{display:flex;gap:10px;padding:16px 28px 28px;border-top:1px solid var(--line)}
.composer input,.save input,.save select{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line-strong);color:var(--ink);font-size:15px;padding:10px 0;min-height:44px;outline:none}
.composer button,.save button{background:transparent;color:var(--ink);border:1px solid var(--line-strong);padding:10px 16px;font-size:13px;min-height:44px;cursor:pointer}
.card{margin:0 28px 28px;padding:24px;border:1px solid var(--line-strong);background:var(--panel)}
.card h2{font-size:28px;margin:0 0 12px}
.card[data-v=HOT] h2{color:#c9d4c0}
.card[data-v=NOISE] h2{color:var(--ink-faint)}
.card pre{margin:12px 0 0;font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--ink-dim);white-space:pre-wrap}
.save{display:grid;gap:10px;margin-top:18px}
.save button{justify-self:start}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);min-height:calc(100dvh - 64px)}
.board section{background:var(--bg);padding:24px 18px}
.board h3{font-size:13px;font-weight:500;margin:0 0 16px;color:var(--ink-dim)}
.board h3 em{font-style:normal;color:var(--ink-faint);margin-left:8px}
.board button.lead{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px;color:var(--ink);cursor:pointer}
.board button.lead strong,.board button.lead em,.board button.lead span{display:block}
.board button.lead em{font-style:normal;color:var(--ink-dim);font-size:13px;margin:6px 0}
.board button.lead span{font-size:12px;color:var(--ink-faint)}
.tag{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#c9b7a4}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);padding:28px;overflow:auto}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.seats article{background:var(--panel);padding:24px;min-height:180px}
.seats span{font-family:var(--serif);color:var(--ink-faint)}
.seats h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:12px 0 8px}
.funnel-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 36px}
.funnel-kpis div{background:var(--panel);padding:22px 24px}
.funnel-kpis b{display:block;font-family:var(--serif);font-size:28px;font-weight:400;margin-bottom:8px}
.funnel-kpis span{font-size:12.5px;color:var(--ink-dim)}
.funnel-viz{display:flex;flex-direction:column;align-items:center;gap:7px;margin:0 0 28px}
.funnel-band{display:flex;align-items:center;gap:28px;background:var(--panel);border:1px solid var(--line-strong);padding:16px 28px}
.funnel-band:nth-child(1){width:100%}
.funnel-band:nth-child(2){width:82%}
.funnel-band:nth-child(3){width:64%}
.funnel-band:nth-child(4){width:46%}
.funnel-band strong{font-family:var(--serif);font-size:32px;font-weight:400;min-width:2.2ch}
.funnel-band em{display:block;font-style:normal;font-size:14px}
.funnel-band span{display:block;font-size:12px;color:var(--ink-dim);margin-top:4px}
.stat{background:var(--panel);padding:24px}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:400;margin-bottom:8px}
.stat span{font-size:12.5px;color:var(--ink-dim)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-faint);padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line)}
tr.late td{color:#c9b7a4}
@media(max-width:900px){.desk,.board,.seats,.stats,.rules,.funnel-kpis{grid-template-columns:1fr}.funnel-band{width:100%!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="mark"><span class="aa"><span>A</span><span class="a2">A</span></span><span>Контур</span></div>
  <nav id="nav"></nav>
  <div class="meta" id="meta"></div>
</header>
<div id="app"></div>
<script>
const KEY="asman.ops.v5";
const STEPS=["need","pain","budget","authority","timing"];
const PROMPTS={
  need:"Что необходимо закрыть — одной фразой.",
  pain:"Если не решить в ближайшие три месяца — каковы последствия?",
  budget:"Какой бюджет, в долларах? Необходима цифра.",
  authority:"Решение по оплате принимаете вы, или требуется согласование?",
  timing:"Старт в этом месяце или позднее?"
};
const HINT={HOT:"Связаться в течение суток. Бюджет и решение — на линии.",WARM:"В закрытие не ставить. Уточнить, кто принимает решение и когда готов начать.",NOISE:"В работу не берём."};
const RU={HOT:"Квалифицирован",WARM:"Отложен",NOISE:"Нецелевой",hot:"Квалифицирован",warm:"Отложен",noise:"Нецелевой",closed:"Закрыт"};
const NOISE=/(не знаю|хз|просто смотрю|просто интересуюсь|бесплатно|ваканси|работ[ау]|рекламу настроить|сдс|смм за 50)/i;
const OWNER=/(сам|сама|я решаю|собственник|владелец|директор|учредитель|ип\b|без согласован)/i;
const NOT_OWNER=/(надо спросить|с боссом|с директором|не я решаю|я менеджер|я сотрудник|согласован)/i;
const NOW=/(сейчас|сразу|на этой неделе|в этом месяце|сегодня|срочно|уже)/i;
const LATER=/(потом|подума|когда[- ]нибудь|в следующем|не горит|позже|через полг)/i;
const HOUR=36e5, DAY=24*HOUR;
const TABS=[["filter","Агент"],["leads","Лиды"],["queue","Очередь"],["notes","Заметки"],["principals","Принципалы"],["ledger","Расчёты"]];
const OPENING="Asman. Одна фраза: что необходимо закрыть. Без презентаций.";
const SLOT_LINE="Два рабочих окна: сегодня 18:00 или завтра 11:00. Если оба заняты — завтра 16:00. Напишите слот.";

let state={mandates:[],leads:[],deals:[],events:[],meetings:[],notes:[],lastTick:null};
let view="filter";
let file={need:"",pain:"",budgetUsd:null,budgetRaw:"",authority:"unknown",timing:"unknown"};
let step="need", msgs=[{from:"bot",text:OPENING}], draft="", verdict=null, saved=false;
let name="", contact="", slot=null, openId=null, gross="", inflow="", mName="", mNiche="", mShare="50", mErr="";

function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r)state={mandates:r.mandates||[],leads:r.leads||[],deals:r.deals||[],events:r.events||[],meetings:r.meetings||[],notes:r.notes||[],lastTick:r.lastTick||null}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
function plusH(iso,h){return new Date(new Date(iso).getTime()+h*HOUR).toISOString()}
function bizDays(from,days){const d=new Date(from);let left=days;while(left>0){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)left--}return d}
function parseBudget(raw){
  const t=raw.toLowerCase().replace(/\s+/g," ").trim(); if(!t)return null;
  if(/(нет бюджета|денег нет|пока нет|не готов)/i.test(t))return 0;
  const mln=t.match(/(\d+(?:[.,]\d+)?)\s*(млн|миллион)/);
  if(mln){const n=Number(mln[1].replace(",","."));return (t.includes("тенге")||t.includes("тг")||t.includes("kzt"))?Math.round(n*1e6/500):n*1e6}
  const k=t.match(/(\d+(?:[.,]\d+)?)\s*(тыс|k\b)/);
  if(k){const n=Number(k[1].replace(",","."));return (t.includes("тенге")||t.includes("тг")||t.includes("kzt"))?Math.round(n*1000/500):n*1000}
  const num=t.match(/(\d+(?:[.,]\d+)?)/); if(!num)return null;
  let n=Number(num[1].replace(",",".")); if(t.includes("тенге")||t.includes("тг")||t.includes("kzt"))n=n/500; return Math.round(n);
}
function score(f){
  const reasons=[], blob=`${f.need} ${f.pain} ${f.budgetRaw}`;
  if(NOISE.test(blob))return{verdict:"NOISE",reasons:["Запрос вне периметра. В работу не берём."]};
  const budgetOk=f.budgetUsd!==null&&f.budgetUsd>=2000;
  const painOk=f.pain.length>12&&!/(ничего|нормально|не критично)/i.test(f.pain);
  const ownerOk=f.authority==="yes", nowOk=f.timing==="now";
  if(f.budgetUsd!==null&&f.budgetUsd<2000)reasons.push("Бюджет ниже порога $2,000.");
  else if(f.budgetUsd===null)reasons.push("Бюджет не назван.");
  else reasons.push("Бюджет ~$"+f.budgetUsd.toLocaleString("en-US")+".");
  reasons.push(painOk?"Стоимость бездействия сформулирована.":"Нет измеримой стоимости бездействия.");
  reasons.push(ownerOk?"Решение принимает сам.":"Решение по оплате не на линии.");
  reasons.push(nowOk?"Готов начать в этом месяце.":"Горизонт сдвинут.");
  if(budgetOk&&painOk&&ownerOk&&nowOk)return{verdict:"HOT",reasons};
  if(budgetOk&&(painOk||ownerOk))return{verdict:"WARM",reasons};
  return{verdict:"NOISE",reasons};
}
function brief(f,v,reasons){
  const who=f.authority==="yes"?"сам":f.authority==="no"?"требуется согласование":"не установлено";
  const when=f.timing==="now"?"этот месяц":f.timing==="later"?"позднее":"не установлено";
  const mark=v==="HOT"?"квалифицирован":v==="WARM"?"отложен":"нецелевой";
  return [`Статус: ${mark}`,`Запрос: ${f.need||"—"}`,`Бездействие: ${f.pain||"—"}`,`Бюджет: ${f.budgetRaw||"—"}`,`Решение: ${who}`,`Срок: ${when}`,...reasons.map(r=>"· "+r)].join("\n");
}
function ingest(f,s,text){
  const n={...f}, t=text.trim();
  if(s==="need")n.need=t;
  if(s==="pain")n.pain=t;
  if(s==="budget"){n.budgetRaw=t;n.budgetUsd=parseBudget(t)}
  if(s==="authority")n.authority=OWNER.test(t)?"yes":NOT_OWNER.test(t)?"no":t.length>0?"yes":"unknown";
  if(s==="timing")n.timing=NOW.test(t)?"now":LATER.test(t)?"later":"now";
  return n;
}
function tick(){
  const now=new Date(), seen=new Set(state.events.map(e=>e.id)), events=[...state.events], leads=state.leads.map(l=>({...l}));
  const push=(id,ev)=>{if(seen.has(id))return;seen.add(id);events.unshift({id,...ev})};
  for(const lead of leads){
    if(lead.stage==="hot"){
      lead.nextAction="close"; lead.nextActionAt=lead.nextActionAt||plusH(lead.createdAt,24);
      if(!lead.lastTouchedAt && now-new Date(lead.createdAt)>=DAY){
        lead.sla=true;
        push("sla:"+lead.id,{at:now.toISOString(),leadId:lead.id,kind:"sla",text:lead.name+": квалифицирован, контакт в течение суток не состоялся."});
      }
    }
    if(lead.stage==="warm"){
      const age=now-new Date(lead.createdAt);
      if(age>=14*DAY){lead.stage="noise";lead.nextAction=null;lead.nextActionAt=null;push("drop:"+lead.id,{at:now.toISOString(),leadId:lead.id,kind:"drop",text:lead.name+": 14 дней без движения. Снят как нецелевой."})}
      else if(age>=3*DAY){lead.nextAction="nurture";lead.nextActionAt=plusH(lead.createdAt,72);push("nurture:"+lead.id,{at:now.toISOString(),leadId:lead.id,kind:"nurture",text:lead.name+": уточнить лицо, принимающее решение, и срок старта."})}
    }
  }
  for(const deal of state.deals){
    if(deal.paid||new Date(deal.dueAt)>now)continue;
    const lead=leads.find(l=>l.id===deal.leadId);
    push("overdue:"+deal.id,{at:now.toISOString(),leadId:deal.leadId,kind:"overdue",text:(lead?lead.name:"сделка")+": вознаграждение 10% просрочено. Пеня 0,5% в день."});
  }
  state={...state,leads,events:events.slice(0,80),lastTick:now.toISOString()}; save();
}
function due(){
  const now=new Date(), items=[];
  for(const lead of state.leads){
    if(lead.stage==="hot")items.push({lead,label:lead.sla?"Сутки без контакта":"Связаться в течение суток"});
    else if(lead.stage==="warm"&&lead.nextAction==="nurture")items.push({lead,label:"Уточнить решение и срок"});
  }
  for(const deal of state.deals){
    if(deal.paid||new Date(deal.dueAt)>now)continue;
    const lead=state.leads.find(l=>l.id===deal.leadId); if(lead)items.push({lead,label:"Вознаграждение 10%"});
  }
  return items;
}
function resetFilter(){
  file={need:"",pain:"",budgetUsd:null,budgetRaw:"",authority:"unknown",timing:"unknown"};
  step="need"; msgs=[{from:"bot",text:OPENING}]; draft=""; verdict=null; saved=false; name=""; contact=""; slot=null;
}
function parseIdentity(text){
  const t=text.trim(); const phone=t.match(/(\+?\d[\d\s\-()]{8,}\d)/);
  const c=phone?phone[1].replace(/\s+/g," ").trim():t;
  let n=phone?t.replace(phone[0],"").replace(/[,;|/]+/g," ").trim():t;
  n=n.replace(/\s+/g," "); if(n.length<2)n="Без имени"; return {name:n,contact:c};
}
function parseSlot(text){
  const t=text.toLowerCase();
  if(/18|вечер|сегодня/.test(t)&&!/завтра/.test(t))return "сегодня 18:00";
  if(/11|утро/.test(t))return "завтра 11:00";
  if(/16|обед/.test(t))return "завтра 16:00";
  if(/завтра/.test(t))return "завтра 11:00";
  if(t.length>3)return t.trim(); return null;
}
function negotiate(text){
  const t=text.toLowerCase();
  if(/(нет|без возраж|ок|хорошо|согласен|давай|ставим)/i.test(t))return "Принято. Встреча в календаре, заметка записана. На линии — только решение и цифра.";
  if(/(дорог|скидк|дешев)/i.test(t))return "Цены нет. Есть доля от выручки, которую приведём. Фикса не берём.";
  if(/(подума|позже|не сейч)/i.test(t))return "Слот держим 24 часа. После — снимаем.";
  if(/(партнёр|директор|согласов|спрошу)/i.test(t))return "На встречу нужен тот, кто принимает решение по оплате.";
  if(/(презентац|коммерч|прайс|отправ)/i.test(t))return "Презентаций не высылаем. Коротко на звонке. Либо работаем, либо нет.";
  if(/(гарант|результат)/i.test(t))return "Гарантия — отсутствие фикса. Если потока нет, вы нам ничего не должны.";
  return "Зафиксировал. На встрече разберём.";
}
function persistAgent(){
  const now=new Date(), createdAt=now.toISOString(), locked=new Date(now); locked.setMonth(locked.getMonth()+12);
  const stage=verdict.verdict==="HOT"?"hot":verdict.verdict==="WARM"?"warm":"noise";
  const body=[brief(file,verdict.verdict,verdict.reasons),`Имя: ${name||"—"}`,`Контакт: ${contact||"—"}`,`Встреча: ${slot||"не ставили"}`].join("\n");
  const row={id:uid(),mandateId:null,name:name.trim()||"Без имени",contact:contact.trim(),need:file.need,pain:file.pain,budgetUsd:file.budgetUsd,budgetRaw:file.budgetRaw,authority:file.authority,timing:file.timing,verdict:verdict.verdict,stage,brief:body,createdAt,lockedUntil:locked.toISOString(),lastTouchedAt:null,sla:false,nextAction:stage==="hot"?"close":stage==="warm"?"nurture":null,nextActionAt:stage==="hot"?plusH(createdAt,24):stage==="warm"?plusH(createdAt,72):null};
  const events=[{id:"lock:"+row.id,at:createdAt,leadId:row.id,kind:"lock",text:`${row.name}: ${RU[row.verdict].toLowerCase()}. Фиксация на 12 месяцев.`},...state.events];
  const meetings=slot?[{id:uid(),leadId:row.id,slot,createdAt},...state.meetings]:state.meetings;
  if(slot)events.unshift({id:"meet:"+row.id,at:createdAt,leadId:row.id,kind:"meet",text:`${row.name}: встреча — ${slot}.`});
  const note={id:uid(),leadId:row.id,title:`${row.name} · ${RU[row.verdict].toLowerCase()}`,body,createdAt};
  events.unshift({id:"note:"+note.id,at:createdAt,leadId:row.id,kind:"note",text:"Заметка: "+note.title});
  state={...state,leads:[row,...state.leads],meetings,notes:[note,...state.notes],events:events.slice(0,80)}; save(); saved=true;
}
function agentTurn(text){
  const t=text.trim(); if(!t||step==="done")return;
  msgs=[...msgs,{from:"lead",text:t}];
  if(["need","pain","budget","authority","timing"].includes(step)){
    file=ingest(file,step,t); const i=STEPS.indexOf(step); const nxt=i<STEPS.length-1?STEPS[i+1]:"done";
    if(nxt!=="done"){step=nxt;msgs.push({from:"bot",text:PROMPTS[nxt]});return}
    verdict=score(file);
    if(verdict.verdict==="NOISE"){step="done";msgs.push({from:"bot",text:HINT.NOISE});persistAgent();return}
    if(verdict.verdict==="WARM"){step="identity";msgs.push({from:"bot",text:HINT.WARM+" Имя и WhatsApp — одной строкой. Встречу не ставлю."});return}
    step="identity"; msgs.push({from:"bot",text:HINT.HOT+" Имя и WhatsApp — одной строкой."}); return;
  }
  if(step==="identity"){
    const id=parseIdentity(t); name=id.name; contact=id.contact;
    if(verdict.verdict==="HOT"){step="slot";msgs.push({from:"bot",text:SLOT_LINE});return}
    step="done"; msgs.push({from:"bot",text:"Зафиксировал. В очередь не ставлю, пока не ясно решение."}); persistAgent(); return;
  }
  if(step==="slot"){
    const s=parseSlot(t); if(!s){msgs.push({from:"bot",text:SLOT_LINE});return}
    slot=s; step="negotiate"; msgs.push({from:"bot",text:`Слот: ${s}. Возражение — сейчас, одной фразой. Если нет — напишите «нет».`}); return;
  }
  if(step==="negotiate"){step="done"; msgs.push({from:"bot",text:negotiate(t)}); persistAgent()}
}
function esc(s){
  return String(s||"").replace(/[&<>"]/g, function(c){
    if(c==="&") return "\x26amp;";
    if(c==="<") return "\x26lt;";
    if(c===">") return "\x26gt;";
    return "\x26quot;";
  });
}

function render(){
  const active=state.mandates.filter(m=>m.status==="active");
  const owed=state.deals.filter(d=>!d.paid).reduce((s,d)=>s+d.inflow*d.rate,0);
  const sla=state.leads.filter(l=>l.sla).length;
  document.getElementById("nav").innerHTML=TABS.map(([id,l])=>`<a href="#${id}" class="${view===id?"on":""}">${l}</a>`).join("");
  document.getElementById("meta").innerHTML=`<span>Принципалы ${active.length}/3</span><span>К выплате ${money(owed)}</span>${sla?`<span class="sla">Без контакта: ${sla}</span>`:""}`;
  const app=document.getElementById("app");
  if(view==="queue"){
    const items=due();
    const incoming=state.leads.length;
    const after=state.leads.filter(l=>l.stage!=="noise").length;
    const closing=state.leads.filter(l=>l.stage==="hot").length;
    const closed=state.leads.filter(l=>l.stage==="closed").length;
    const pipe=state.leads.filter(l=>l.stage==="hot").reduce((s,l)=>s+(l.budgetUsd||0),0);
    const won=state.deals.filter(d=>d.paid).reduce((s,d)=>s+d.inflow*d.rate,0);
    const conv=(a,b)=>b===0?"—":Math.round(a/b*100)+"%";
    app.innerHTML=`<div class="page">
      <p class="kicker">Контур</p>
      <h1>Воронка</h1>
      <div class="funnel-kpis">
        <div><b>${money(pipe)}</b><span>В работе, бюджет квалифицированных</span></div>
        <div><b>${conv(after,incoming)}</b><span>Доля, прошедшая фильтр</span></div>
        <div><b>${money(won)}</b><span>Вознаграждение получено</span></div>
      </div>
      <div class="funnel-viz">
        <div class="funnel-band"><strong>${incoming}</strong><div><em>Обращения</em><span>весь входящий спрос</span></div></div>
        <div class="funnel-band"><strong>${after}</strong><div><em>После фильтра</em><span>конверсия ${conv(after,incoming)}</span></div></div>
        <div class="funnel-band"><strong>${closing}</strong><div><em>В закрытии</em><span>конверсия ${conv(closing,after)}</span></div></div>
        <div class="funnel-band"><strong>${closed}</strong><div><em>Закрыто</em><span>конверсия ${conv(closed,after)}</span></div></div>
      </div>
      <h2>Встречи</h2>
      ${state.meetings.length?`<ul class="queue">${state.meetings.map(m=>{const lead=state.leads.find(l=>l.id===m.leadId);return `<li><div><strong>${esc(lead?lead.name:"лид")}</strong><span>${esc(m.slot)}</span></div></li>`}).join("")}</ul>`:`<p class="empty">Слотов нет. Агент ставит встречу после квалификации.</p>`}
      <h2>Очередь</h2>
      ${items.length?`<ul class="queue">${items.map(i=>`<li><div><strong>${esc(i.lead.name)}</strong><span>${esc(i.label)}</span></div>${i.lead.stage==="hot"?`<button class="ghost" data-touch="${i.lead.id}">Контакт состоялся</button>`:""}</li>`).join("")}</ul>`:`<p class="empty">Готово к работе. Новое обращение — в Фильтре.</p>`}
      <h2>Журнал</h2>
      ${state.events.length?`<ol class="log">${state.events.map(e=>`<li><time>${new Date(e.at).toLocaleString("ru-KZ")}</time>${esc(e.text)}</li>`).join("")}</ol>`:`<p class="empty">Пока пусто. Появится после первого обращения.</p>`}
    </div>`;
    app.querySelectorAll("[data-touch]").forEach(b=>b.onclick=()=>{touch(b.dataset.touch);render()});
  } else if(view==="filter"){
    const gates=[["need","Запрос"],["pain","Последствия"],["budget","Бюджет"],["authority","Решение"],["timing","Срок"],["identity","Контакт"],["slot","Встреча"],["negotiate","Переговоры"]];
    const order=gates.map(g=>g[0]); const nowIdx=order.indexOf(step);
    app.innerHTML=`<div class="desk">
      <aside>
        <p class="kicker">Агент</p>
        <ol>${gates.map((g,i)=>`<li class="${(nowIdx>i||step==="done")?"on":""} ${step===g[0]?"now":""}">${g[1]}</li>`).join("")}</ol>
        <p class="note">Пишете ответ человека. Агент фильтрует, ставит слот, держит переговоры и пишет заметку. Порог — $2,000.</p>
        <button class="ghost" id="reset" style="margin-top:20px">Новое обращение</button>
      </aside>
      <section>
        <div class="desk-log">${msgs.map(m=>`<p class="${m.from==="lead"?"lead":""}"><i>${m.from==="bot"?"Агент":"Обращение"}</i>${esc(m.text)}</p>`).join("")}</div>
        ${verdict&&step==="done"?`<article class="card" data-v="${verdict.verdict}">
          <h2>${RU[verdict.verdict]}</h2>
          <p class="note">${slot?"Встреча: "+esc(slot)+". ":""}Заметка в журнале.</p>
          <pre>${esc(brief(file,verdict.verdict,verdict.reasons))}</pre>
        </article>`:`<form class="composer" id="send"><input id="draft" placeholder="Ответ человека" autocomplete="off"><button>Передать</button></form>`}
      </section>
    </div>`;
    const r=document.getElementById("reset"); if(r)r.onclick=()=>{resetFilter();render()};
    const send=document.getElementById("send");
    if(send)send.onsubmit=e=>{e.preventDefault(); agentTurn(document.getElementById("draft").value); render()};
  } else if(view==="notes"){
    app.innerHTML=`<div class="page"><p class="kicker">Заметки</p><h1>Журнал агента</h1>
      ${state.notes.length===0?`<p class="empty">Пусто. Заметка появится, когда агент закроет диалог.</p>`:`<ul class="log">${state.notes.map(n=>`<li><time>${new Date(n.createdAt).toLocaleString("ru-KZ")}</time><strong>${esc(n.title)}</strong><pre>${esc(n.body)}</pre></li>`).join("")}</ul>`}
    </div>`;
  } else if(view==="leads"){
    const cols=["hot","warm","noise","closed"];
    const lead=state.leads.find(l=>l.id===openId);
    app.innerHTML=`<div class="board">${state.leads.length===0?`<p class="empty" style="padding:36px">Лидов нет. Новое обращение — в Фильтре.</p>`:cols.map(c=>{
      const rows=state.leads.filter(l=>l.stage===c);
      return `<section><h3>${RU[c]} <em>${rows.length}</em></h3>${rows.map(l=>`<button class="lead" data-open="${l.id}"><strong>${esc(l.name)}</strong><em>${esc(l.need||"—")}</em><span>${l.budgetUsd?money(l.budgetUsd):esc(l.budgetRaw||"без цифры")}</span>${l.sla?`<i class="tag">без контакта</i>`:""}</button>`).join("")}</section>`;
    }).join("")}</div>
    ${lead?`<div class="drawer-bg" id="bg"><aside class="drawer">
      <p class="kicker">${RU[lead.verdict]}</p>
      <h2>${esc(lead.name)}</h2>
      <p class="note">${esc(lead.contact||"контакт не указан")}</p>
      <pre>${esc(lead.brief)}</pre>
      <p class="note" style="margin:16px 0">Фиксация до ${new Date(lead.lockedUntil).toLocaleDateString("ru-KZ")}</p>
      ${lead.stage==="hot"?`<button class="ghost" id="touched">Контакт состоялся</button>
        <form class="save" id="inflow">
          <input id="g" placeholder="Сумма договора, $" inputmode="decimal" value="${esc(gross)}">
          <input id="i" placeholder="Поступило, $" inputmode="decimal" value="${esc(inflow)}">
          <button>Фиксировать 10%</button>
        </form>`:""}
      ${lead.stage!=="noise"&&lead.stage!=="closed"?`<button class="ghost" id="noise" style="margin-top:10px">Нецелевой</button>`:""}
      <button class="ghost" id="closeD" style="margin-top:10px">Закрыть</button>
    </aside></div>`:""}`;
    app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openId=b.dataset.open;render()});
    const bg=document.getElementById("bg"); if(bg)bg.onclick=e=>{if(e.target===bg){openId=null;render()}};
    const cd=document.getElementById("closeD"); if(cd)cd.onclick=()=>{openId=null;render()};
    const t=document.getElementById("touched"); if(t)t.onclick=()=>{touch(lead.id);render()};
    const n=document.getElementById("noise"); if(n)n.onclick=()=>{state={...state,leads:state.leads.map(l=>l.id===lead.id?{...l,stage:"noise"}:l)};save();render()};
    const inf=document.getElementById("inflow");
    if(inf)inf.onsubmit=e=>{
      e.preventDefault();
      const g=Number(document.getElementById("g").value), i=Number(document.getElementById("i").value); if(!g||!i)return;
      const now=new Date();
      const row={id:uid(),leadId:lead.id,mandateId:lead.mandateId,gross:g,inflow:i,rate:0.1,dueAt:bizDays(now,3).toISOString(),paid:false,createdAt:now.toISOString()};
      const event={id:"close:"+row.id,at:row.createdAt,leadId:lead.id,kind:"close",text:`${lead.name}: поступление ${i}$. Вознаграждение 10% — 3 рабочих дня.`};
      state={...state,deals:[row,...state.deals],leads:state.leads.map(l=>l.id===lead.id?{...l,stage:"closed",nextAction:null,nextActionAt:null}:l),events:[event,...state.events].slice(0,80)};
      save(); openId=null; render();
    };
  } else if(view==="principals"){
    const seats=[0,1,2].map(i=>active[i]||null);
    app.innerHTML=`<div class="page">
      <p class="kicker">Одновременно не более трёх</p>
      <div class="seats">${seats.map((m,i)=>`<article>${m?`<span>0${i+1}</span><h3>${esc(m.name)}</h3><p class="note">${esc(m.niche)}</p><p class="note">Доля структуры ${m.asmanSharePct}%</p><button class="ghost" data-close="${m.id}" style="margin-top:16px">Закрыть мандат</button>`:`<span>0${i+1}</span><h3>Свободно</h3>`}</article>`).join("")}</div>
      <form class="save slim" id="addm" style="max-width:520px">
        <input id="pn" placeholder="Принципал" required value="${esc(mName)}">
        <input id="pi" placeholder="Ниша" required value="${esc(mNiche)}">
        <select id="ps"><option value="50" ${mShare==="50"?"selected":""}>50 / 50</option><option value="30" ${mShare==="30"?"selected":""}>30 / 70</option></select>
        <button>Принять мандат</button>
      </form>
      ${mErr?`<p class="note" style="margin-top:12px">${esc(mErr)}</p>`:""}
    </div>`;
    app.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{state={...state,mandates:state.mandates.map(m=>m.id===b.dataset.close?{...m,status:"closed"}:m)};save();render()});
    document.getElementById("addm").onsubmit=e=>{
      e.preventDefault();
      if(active.length>=3){mErr="Одновременно не более трёх принципалов.";render();return}
      const row={id:uid(),name:document.getElementById("pn").value.trim(),niche:document.getElementById("pi").value.trim(),asmanSharePct:Number(document.getElementById("ps").value)||50,status:"active",createdAt:new Date().toISOString()};
      state={...state,mandates:[row,...state.mandates]}; save(); mName=""; mNiche=""; mErr=""; render();
    };
  } else if(view==="ledger"){
    const open=state.deals.filter(d=>!d.paid); const overdue=open.filter(d=>new Date(d.dueAt)<new Date()).length;
    app.innerHTML=`<div class="page">
      <div class="stats">
        <div class="stat"><b>${money(owed)}</b><span>К выплате. 10% от поступивших сумм</span></div>
        <div class="stat"><b>${overdue}</b><span>Просрочено свыше 3 рабочих дней</span></div>
        <div class="stat"><b>${state.deals.length}</b><span>Зафиксированных поступлений</span></div>
      </div>
      ${state.deals.length===0?`<p class="empty">Поступлений нет. Сумму договора фиксируют в карточке квалифицированного лида.</p>`:`<table><thead><tr><th>Лид</th><th>Договор</th><th>Поступило</th><th>10%</th><th>Срок</th><th></th></tr></thead><tbody>
        ${state.deals.map(d=>{
          const lead=state.leads.find(l=>l.id===d.leadId); const late=!d.paid&&new Date(d.dueAt)<new Date();
          return `<tr class="${late?"late":""}"><td>${esc(lead?lead.name:"—")}</td><td>${money(d.gross)}</td><td>${money(d.inflow)}</td><td>${money(d.inflow*d.rate)}</td><td>${new Date(d.dueAt).toLocaleDateString("ru-KZ")}</td><td>${d.paid?"получено":`<button class="ghost" data-paid="${d.id}">Получено</button>`}</td></tr>`;
        }).join("")}
      </tbody></table>`}
    </div>`;
    app.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{state={...state,deals:state.deals.map(d=>d.id===b.dataset.paid?{...d,paid:true}:d)};save();render()});
  }
}
function touch(id){
  const now=new Date().toISOString(); const lead=state.leads.find(l=>l.id===id);
  state={...state,leads:state.leads.map(l=>l.id===id?{...l,lastTouchedAt:now,sla:false}:l),events:[{id:"touch:"+id+":"+now,at:now,leadId:id,kind:"touch",text:(lead?lead.name:"лид")+": контакт зафиксирован."},...state.events].slice(0,80)};
  save();
}
function route(){
  try {
    const h=(location.hash||"#filter").slice(1);
    view=TABS.some(t=>t[0]===h)?h:"queue";
    tick(); render();
  } catch (err) {
    document.getElementById("app").innerHTML="<p class='empty'>Ошибка контура. Обновите страницу.</p>";
    console.error(err);
  }
}
load(); window.onhashchange=route; route();
</script>
