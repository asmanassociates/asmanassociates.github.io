<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asman Associates — wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0A0D11}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .line{
    font-family:Inter,"Helvetica Neue",Arial,sans-serif;
    font-weight:400;font-size:clamp(12px,3.2vw,22px);
    letter-spacing:.45em;text-transform:uppercase;color:#fff;
    padding-right:.45em;white-space:nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="line">Asman Associates</div>
</div>
</body>
</html>
