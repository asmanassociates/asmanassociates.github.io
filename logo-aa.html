<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asman — AA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0A0D11}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
  .aa{
    position:relative;width:1.42em;height:.86em;
    font-family:"Bodoni Moda",Georgia,serif;font-weight:400;
    font-size:min(42vw,280px);line-height:1;color:#fff;
  }
  .aa span{position:absolute;top:0;left:0}
  .aa .a2{left:.42em}
</style>
</head>
<body>
<div class="wrap">
  <div class="aa" aria-label="AA"><span>A</span><span class="a2">A</span></div>
</div>
</body>
</html>
